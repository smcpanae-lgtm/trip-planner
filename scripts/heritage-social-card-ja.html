<meta charset="utf-8">
<!--
  日本語版の OGP / X カード画像（1200x630）の元データ。

  このファイルを Chrome のヘッドレスモードで撮影して
  public/heritage/assets/social-card-ja.png を作り直す。

    "C:\Program Files\Google\Chrome\Application\chrome.exe" ^
      --headless=new --disable-gpu --hide-scrollbars ^
      --allow-file-access-from-files --force-device-scale-factor=1 ^
      --window-size=1200,630 ^
      --screenshot="public\heritage\assets\social-card-ja.png" ^
      "scripts\heritage-social-card-ja.html"

  文言や写真を変えたいときは、このファイルを直してから撮り直す。
  英語版カードは public/heritage/assets/social-card.png（既存・英語表記）を使う。
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    font-family: "Noto Sans JP", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif;
    background:
      radial-gradient(900px 620px at 78% 18%, rgba(255,255,255,.16), transparent 62%),
      linear-gradient(135deg, #0d4a3f 0%, #176b5b 52%, #1f8874 100%);
    color: #fff;
  }
  .frame {
    position: absolute; inset: 26px;
    border: 2px solid rgba(255,255,255,.22);
    border-radius: 22px;
  }

  .left {
    position: absolute;
    left: 74px; top: 78px; width: 620px;
  }
  .eyebrow {
    display: inline-block;
    font-size: 21px; font-weight: 700; letter-spacing: .14em;
    color: #f0c675;
    margin-bottom: 22px;
  }
  .eyebrow::before {
    content: ""; display: inline-block;
    width: 34px; height: 2px; background: #c8943f;
    vertical-align: middle; margin-right: 14px;
  }
  h1 {
    font-size: 78px; font-weight: 800; line-height: 1.16;
    letter-spacing: .01em;
    text-shadow: 0 6px 22px rgba(0,0,0,.22);
  }
  .lead {
    margin-top: 26px;
    font-size: 26px; font-weight: 500; line-height: 1.55;
    color: rgba(255,255,255,.94);
  }
  .chips { margin-top: 30px; display: flex; gap: 12px; }
  .chip {
    font-size: 19px; font-weight: 700;
    padding: 10px 18px; border-radius: 999px;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.3);
  }
  .url {
    position: absolute; left: 74px; bottom: 74px;
    font-size: 23px; font-weight: 700; letter-spacing: .01em;
    color: rgba(255,255,255,.95);
  }
  .url::before {
    content: ""; display: inline-block;
    width: 10px; height: 10px; border-radius: 50%;
    background: #f0c675; margin-right: 12px; vertical-align: middle;
  }

  .stamps {
    position: absolute;
    right: 68px; top: 50%; transform: translateY(-50%);
    display: grid; grid-template-columns: repeat(2, 188px);
    gap: 20px;
  }
  .stamp {
    position: relative;
    width: 188px; height: 136px;
    border-radius: 14px;
    border: 4px solid rgba(255,255,255,.92);
    overflow: hidden;
    box-shadow: 0 14px 30px rgba(0,0,0,.28);
  }
  .stamp img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .stamp:nth-child(odd) { transform: rotate(-2.2deg); }
  .stamp:nth-child(even) { transform: rotate(1.8deg); }
  .stamp::after {
    content: "✓";
    position: absolute; right: 8px; bottom: 6px;
    width: 30px; height: 30px; border-radius: 50%;
    background: #c8943f; color: #fff;
    font-size: 17px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 8px rgba(0,0,0,.3);
  }
</style>

<div class="frame"></div>

<div class="left">
  <span class="eyebrow">ブラウザ内だけに保存する旅の記録</span>
  <h1>世界遺産<br>パスポート</h1>
  <p class="lead">訪れた世界遺産を、あなただけの<br>写真スタンプで記録。</p>
  <div class="chips">
    <span class="chip">ブラウザ内保存</span>
    <span class="chip">写真スタンプ</span>
    <span class="chip">全1,273件</span>
  </div>
</div>

<div class="url">www.ai-drive-planner.com/heritage/</div>

<div class="stamps">
  <div class="stamp"><img src="../public/heritage/assets/heritage/fuji.webp"></div>
  <div class="stamp"><img src="../public/heritage/assets/heritage/kyoto.webp"></div>
  <div class="stamp"><img src="../public/heritage/assets/heritage/great-wall.webp"></div>
  <div class="stamp"><img src="../public/heritage/assets/heritage/taj-mahal.webp"></div>
  <div class="stamp"><img src="../public/heritage/assets/heritage/pyramids.webp"></div>
  <div class="stamp"><img src="../public/heritage/assets/heritage/machu-picchu.webp"></div>
</div>
